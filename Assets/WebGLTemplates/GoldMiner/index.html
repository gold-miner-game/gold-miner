<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Play Gold Miner in your browser. Collect treasure, dodge hooks, and explore the world map.">
  <title>Gold Miner</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #110e0a; }
    body { font: 16px system-ui, sans-serif; color: #f6e9cc; }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 20px; text-align: center; background: #352316; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 54px); color: #f8cd70; }
    progress { width: min(320px, 75vw); height: 12px; accent-color: #f8cd70; }
    p { margin: 0; color: #d9c9ac; }
    #load-error { display: none; max-width: 360px; line-height: 1.5; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="Gold Miner game. Move with WASD or arrow keys. K uses your skill, J cuts ropes, and Escape pauses."></canvas>
  <div id="loading" role="status" aria-live="polite">
    <h1>Gold Miner</h1>
    <progress id="load-progress" max="1" value="0" aria-label="Loading game"></progress>
    <p id="load-message">Getting your treasure ready…</p>
    <p id="load-error" role="alert">The game couldn't load. Refresh the page and try again.</p>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const progress = document.getElementById("load-progress");
    function showLoadError(error) {
      console.error(error);
      document.getElementById("load-message").hidden = true;
      progress.hidden = true;
      document.getElementById("load-error").style.display = "block";
    }
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      autoSyncPersistentDataPath: true,
      showBanner: (message, type) => { if (type === "error") showLoadError(message); else console.warn(message); }
    }, value => { progress.value = value; }).then(instance => {
      window.goldMinerInstance = instance;
      window.goldMinerReady = true;
      loading.remove();
      canvas.focus();
      canvas.addEventListener("pointerdown", () => canvas.focus());
    }).catch(showLoadError);
    window.addEventListener("keydown", event => {
      if (document.activeElement === canvas && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
    });
  </script>
</body>
</html>
